<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Approval — Acme vendor onboarding</title>
  <link rel="stylesheet" href="/acme.css">
</head>
<body>
  <main class="wrap">
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/deck/">Deck</a>
      <a href="/dataset/">Dataset</a>
      <a href="/approval/" aria-current="page">Approval</a>
      <a href="/ops/">Ops</a>
      <a href="/api-literacy/">API</a>
    </nav>
    <h1>Approval</h1>
    <p class="lede" id="lede">The email link opens this vendor. Pick who is logged in, then approve or deny. The page sends that decision to the Vendor Intake bot. The dropdown is the exercise stand-in for SSO.</p>
    <form class="form" id="decision" hidden>
      <article class="panel" id="brief"></article>
      <div id="signer">
        <label>
          Logged in as
          <select id="who" name="signed_by">
            <option value="Marcus Adeyemi" data-role="Security">Marcus Adeyemi — Security</option>
            <option value="Riley Chen" data-role="Finance approver">Riley Chen — Finance approver</option>
            <option value="Elena Voss" data-role="Business owner">Elena Voss — Business owner, Initech</option>
            <option value="Priya Shah" data-role="Business owner">Priya Shah — Business owner, Contoso</option>
          </select>
        </label>
        <div class="actions">
          <button class="primary" type="submit" data-action="approve">Approve</button>
          <button type="submit" data-action="deny">Deny</button>
        </div>
      </div>
      <p class="decision-line" id="decision-line" role="status" hidden></p>
      <p class="result" id="result"></p>
    </form>
  </main>
  <script>
    const form = document.querySelector("#decision");
    const brief = document.querySelector("#brief");
    const decisionLine = document.querySelector("#decision-line");
    const result = document.querySelector("#result");
    const signer = document.querySelector("#signer");
    const who = document.querySelector("#who");
    const buttons = [...form.querySelectorAll("button")];
    const fieldLabels = {
      vendor_legal_name: "legal name",
      website: "website",
      business_owner: "business owner",
      target_start_date: "target start date",
      touches_customer_data: "customer-data flag"
    };
    let caseReady = false;
    const lede = document.querySelector("#lede");

    function caseIdFromLocation() {
      const parts = location.pathname.split("/").filter(Boolean);
      if (parts[0] === "approval" && /^VND-\d+$/.test(parts[1] || "")) return parts[1];
      const query = new URLSearchParams(location.search).get("case") || "";
      return /^VND-\d+$/.test(query) ? query : "";
    }

    const caseId = caseIdFromLocation();

    function setReady(ready) {
      caseReady = ready;
      signer.hidden = !ready;
      for (const button of buttons) button.disabled = !ready;
      who.disabled = !ready;
    }

    function lockSigner() {
      caseReady = false;
      for (const button of buttons) button.disabled = true;
      who.disabled = true;
    }

    function notReadyMessage(item) {
      const missing = (item.missing || []).map((key) => fieldLabels[key] || key);
      if (missing.length === 1) {
        return `The ${missing[0]} is still missing. There is nothing to approve or deny.`;
      }
      if (missing.length > 1) {
        const list = `${missing.slice(0, -1).join(", ")} and ${missing.at(-1)}`;
        return `These fields are still missing: ${list}. There is nothing to approve or deny.`;
      }
      return "This case cannot take a decision yet.";
    }

    if (!caseId) {
      lede.textContent = "Open a case from the email link or from Ops.";
    } else {
      form.hidden = false;
      brief.innerHTML = "<p>Loading this vendor…</p>";
      fetch("/api/case?id=" + encodeURIComponent(caseId))
        .then((response) => response.json())
        .then((body) => {
          if (!body.ok) {
            brief.innerHTML = `<h2>${caseId}</h2><p>${body.reason || "This case could not be loaded."}</p>`;
            lede.textContent = "This vendor is not waiting for a signature.";
            setReady(false);
            return;
          }
          const item = body.case;
          const email = document.createElement("p");
          email.textContent = item.email || "This case has no approval email yet.";
          brief.innerHTML = "";
          const title = document.createElement("h2");
          title.textContent = item.vendor_legal_name || caseId;
          const gate = document.createElement("p");
          gate.textContent = `${item.case_id} · ${item.gate}`;
          brief.append(title, gate, email);
          setReady(item.ready);
          if (!item.ready) {
            lede.textContent = "This vendor is not waiting for a signature.";
            result.textContent = notReadyMessage(item);
          }
        })
        .catch(() => {
          brief.innerHTML = `<h2>${caseId}</h2><p>The case file could not be read.</p>`;
          lede.textContent = "This vendor is not waiting for a signature.";
          setReady(false);
        });
    }

    function decisionSentence(action, signedBy, role) {
      const kind = action === "approve" ? "Approval" : "Denial";
      return `${kind} Decision for ${role} by ${signedBy} submitted to Vendor Intake Bot (Grok Bot).`;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!caseReady) return;
      const action = event.submitter?.dataset.action;
      const role = who.selectedOptions[0].dataset.role;
      decisionLine.hidden = false;
      decisionLine.textContent = decisionSentence(action, who.value, role);
      result.textContent = "";
      result.className = "result";
      lockSigner();
      try {
        const response = await fetch("/api/approval", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            case_id: caseId,
            action,
            signed_by: who.value,
            role
          })
        });
        const body = await response.json();
        result.textContent = body.reason || "The page could not read a response.";
        result.className = body.delivered ? "result good" : "result bad";
        setReady(!body.delivered);
      } catch {
        result.textContent = "The decision page could not reach the server.";
        result.className = "result bad";
        setReady(true);
      }
    });
  </script>
</body>
</html>
